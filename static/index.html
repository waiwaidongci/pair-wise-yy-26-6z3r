<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="view()">查看可见报告</button><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button><pre id="result"></pre></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><select id="cls"><option value="private">private</option><option value="coordinator">coordinator</option></select><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button><pre id="extra"></pre></section><section><h2>公开预览</h2><div class="grid"><input id="paras" placeholder="可公开段落序号 如 0,2"><input id="mats" placeholder="公开材料 ID 如 1,3"><input id="matid" type="number" placeholder="作废材料 ID"></div><button onclick="mkPreview()">生成公开预览</button><button onclick="getPreview()">查看公开预览</button><button onclick="invalidateMat()">作废材料</button><button onclick="publicAdvisory()">查看公开页</button><pre id="preview"></pre></section><script>const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);async function get(u,el='#result'){show(el,await(await fetch(u)).json())}async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}const nums=s=>s.split(',').map(x=>x.trim()).filter(x=>x!=='').map(Number);async function state(){show('#state',await(await fetch('/api/state')).json())}function view(){get('/api/reports/'+report.value+'?user_id='+user.value)}function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'})}function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:cls.value,uploaded_by:+user.value})}function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}function mkPreview(){post('/api/reports/'+report.value+'/preview',{coordinator_id:+coord.value,paragraphs:nums(paras.value),evidence:nums(mats.value)},'#preview')}function getPreview(){get('/api/reports/'+report.value+'/preview?user_id='+coord.value,'#preview')}function invalidateMat(){post('/api/evidence/'+matid.value+'/invalidate',{user_id:+coord.value},'#preview')}function publicAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id=0','#preview')}state()</script></html>
