<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.blockers{color:#7a1f1f;font-weight:600}label.mat{display:block}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="view()">查看可见报告</button><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button><pre id="result"></pre></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button><pre id="extra"></pre></section><section><h2>公开预览</h2><p>协调员为公告草稿逐段指定公开或保留，并勾选可公开材料；未指定段落、协调员专用材料和已失效材料会被列为阻断。报告或草稿改动会使预览失效。</p><input id="eid" type="number" placeholder="材料 ID"><button onclick="loadPreview()">加载段落与材料</button><button onclick="savePreview()">保存公开预览</button><button onclick="publicAdvisory()">查看公开公告</button><button onclick="invalidateEvidence()">作废材料</button><div id="plist"></div><div id="mlist"></div><div id="blockers" class="blockers"></div><pre id="preview"></pre></section><script>const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);async function get(u,el='#result'){show(el,await(await fetch(u)).json())}async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function view(){get('/api/reports/'+report.value+'?user_id='+user.value)}function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'})}function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:'private',uploaded_by:+user.value})}function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}function renderPreview(d){show('#preview',d);const plist=document.querySelector('#plist');plist.innerHTML='';(d.paragraphs||[]).forEach(p=>{const row=document.createElement('div');const sel=document.createElement('select');sel.dataset.index=p.index;[['','未指定'],['public','公开'],['withheld','保留']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(p.decision===v||(v===''&&p.decision==='undesignated'))o.selected=true;sel.appendChild(o)});row.appendChild(sel);row.appendChild(document.createTextNode(' 第'+(p.index+1)+'段: '+p.text));plist.appendChild(row)});const mlist=document.querySelector('#mlist');mlist.innerHTML='';(d.materials||[]).forEach(m=>{const row=document.createElement('label');row.className='mat';const box=document.createElement('input');box.type='checkbox';box.dataset.eid=m.id;box.checked=!!m.checked;row.appendChild(box);row.appendChild(document.createTextNode(' '+m.name+'（'+m.classification+'/'+m.status+'）→ '+m.summary));mlist.appendChild(row)});document.querySelector('#blockers').textContent=(d.blockers&&d.blockers.length)?'阻断: '+d.blockers.join('；'):(d.ready?'预览可用，无阻断':'')}async function loadPreview(){renderPreview(await(await fetch('/api/reports/'+report.value+'/preview?user_id='+coord.value)).json())}function savePreview(){const pub=[],hid=[];document.querySelectorAll('#plist select').forEach(s=>{const i=+s.dataset.index;if(s.value==='public')pub.push(i);if(s.value==='withheld')hid.push(i)});const ev=[];document.querySelectorAll('#mlist input:checked').forEach(b=>ev.push(+b.dataset.eid));fetch('/api/reports/'+report.value+'/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coordinator_id:+coord.value,public_paragraphs:pub,withheld_paragraphs:hid,evidence_ids:ev})}).then(r=>r.json()).then(renderPreview)}function publicAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id=0','#preview')}function invalidateEvidence(){post('/api/evidence/invalidate',{evidence_id:+eid.value,user_id:+coord.value},'#preview')}state()</script></html>
